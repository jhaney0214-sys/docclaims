[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docclaims"
dynamic = ["version"]
description = "Check the numbers your README states against where they come from. No markup in the prose, no dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["documentation", "readme", "ci", "docs-drift", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
docclaims = "docclaims:main"

[tool.setuptools]
py-modules = ["docclaims"]

[tool.setuptools.dynamic]
version = {attr = "docclaims.__version__"}
