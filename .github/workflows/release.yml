# Publishes to PyPI when a GitHub release is published - the same step that
# lists the action on the Marketplace, so one release does both. It builds
# from the release's tag, refuses a tag that disagrees with __version__, runs
# the tests, then uploads through PyPI's trusted publishing: no token is
# stored anywhere, and PyPI accepts an upload only from this workflow in this
# repository, in the `pypi` environment.
#
# The tag itself is made by ci.yml. A tag pushed by a workflow does not start
# other workflows, which is why this listens for the release instead.
name: release

on:
  release:
    types: [published]
  # To publish a tag that already has a release, or retry a failed upload.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.4.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version
        run: |
          set -eu
          version="v$(python -c 'import docclaims; print(docclaims.__version__)')"
          if [ "$TAG" != "$version" ]; then
            echo "release tag $TAG but docclaims.__version__ gives $version"; exit 1
          fi
      - name: Tests
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m unittest discover -s tests
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/docclaims/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
