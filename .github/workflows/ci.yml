# Runs the tests on every supported Python, then checks this repository's own
# README against its own ledger. The one thing it writes is a version tag, and
# only from main once everything else has passed. Nothing is uploaded or deployed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pytest is not a dependency of docclaims. It is installed here only so
      # the test comparing `tests: "pytest"` with pytest's own collector runs
      # instead of skipping.
      - name: pytest, for the collection cross-check
        run: python -m pip install pytest
      - name: Tests
        run: PYTHONPATH=. python -m unittest discover -s tests
      - name: The README's own numbers
        run: python docclaims.py verify . --scan "*.md"
      - name: The worked example
        run: python docclaims.py verify examples/tiny --scan "*.md"

  # The action, used the way another repository would use it. It has to pass
  # on the clean example and FAIL on a copy with a number that has drifted:
  # an action that cannot fail checks nothing.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean example passes
        uses: ./
        with:
          path: examples/tiny
          scan: "*.md"
      - name: Make the example drift
        run: |
          cp -r examples/tiny /tmp/drifted
          sed -i 's/MAX_RETRIES = 5/MAX_RETRIES = 7/' /tmp/drifted/src/limits.py
      - name: Drifted example fails
        id: drifted
        continue-on-error: true
        uses: ./
        with:
          path: /tmp/drifted
          scan: ""
      - name: The drifted run must have failed
        run: test "${{ steps.drifted.outcome }}" = "failure"


  # A version that reaches main green is tagged, so the README's
  # `docclaims@vX.Y.Z` and `rev: vX.Y.Z` resolve. The tag is read from
  # __version__, and the ledger pins the README to the same value. A tag that
  # already exists is never moved: later commits that keep the version are
  # the same release's fixes, not a new one.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, action]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version if it is new
        run: |
          set -eu
          tag="v$(python3 -c 'import docclaims; print(docclaims.__version__)')"
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            echo "$tag already exists at $existing; left where it is"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "docclaims $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tagged $tag at $GITHUB_SHA"
