name: docclaims
description: Check the numbers your README states against where they come from.
branding:
  icon: check-square
  color: green

inputs:
  path:
    description: Directory holding claims.json.
    default: "."
  scan:
    description: >-
      Space-separated globs swept for files that quote a claim without being
      pinned to it. Empty to skip the sweep.
    default: "**/*.md"
  python-version:
    description: Python to run it with. Any 3.8 or later.
    default: "3.x"

runs:
  using: composite
  steps:
    # The action's own Python, kept off the job's PATH: with setup-python's
    # default, every step after this one in the caller's job ran on the
    # action's Python instead of theirs (found in csp-hash-check, built the
    # same way, 2026-10-19). It is called by its path below.
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
    - name: docclaims verify
      shell: bash
      # Inputs travel as environment variables, not interpolated into the
      # script, so a glob or path can never be read as shell syntax.
      env:
        DOCCLAIMS_PATH: ${{ inputs.path }}
        DOCCLAIMS_SCAN: ${{ inputs.scan }}
        DOCCLAIMS_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        set -f  # globs go to docclaims, not to the shell
        args=(verify "$DOCCLAIMS_PATH")
        if [ -n "$DOCCLAIMS_SCAN" ]; then
          read -r -a globs <<< "$DOCCLAIMS_SCAN"
          args+=(--scan "${globs[@]}")
        fi
        "$DOCCLAIMS_PYTHON" "$GITHUB_ACTION_PATH/docclaims.py" "${args[@]}"
